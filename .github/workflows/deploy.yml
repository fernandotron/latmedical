name: Despliegue Automático a HostGator

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    name: Compilar y Desplegar por FTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️ Compilar proyecto (Producción)
        run: npm run build

      - name: 🚀 Desplegar archivos a HostGator por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: dist/
          security: loose
          dangerous-clean-slate: false
